# Docker Hub images built by .github/workflows/docker-publish.yml
image:
  registry: docker.io
  owner: Parag2008        # <- your Docker Hub username
  tag: latest
  pullPolicy: IfNotPresent

backend:
  replicas: 1                     # keep 1: SQLite + in-process live stream
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""              # "" = cluster default

frontend:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: soc.local                 # add "127.0.0.1 soc.local" to your hosts file for local clusters
  tls: false
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# Non-secret settings (become environment variables on the backend)
config:
  LLM_PROVIDER: auto
  OPENROUTER_MODEL: meta-llama/llama-3.3-70b-instruct
  GROQ_MODEL: openai/gpt-oss-20b
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: llama3.2:3b
  VECTOR_STORE: auto              # Milvus Lite file on the volume unless MILVUS_URI is set
  MILVUS_URI: ""                  # e.g. http://milvus.milvus.svc:19530 for a Milvus cluster
  EMBEDDING_BACKEND: hash
  FIREWALL_PROVIDER: mock         # mock | aws_waf | script
  IDENTITY_PROVIDER: mock         # mock | okta | aws_iam
  AWS_REGION: us-east-1
  AWS_WAF_SCOPE: REGIONAL
  AWS_WAF_IPSET_NAME: ""
  AWS_WAF_IPSET_ID: ""
  OKTA_ORG_URL: ""
  IP_ALLOWLIST: ""
  AUTO_APPROVE: "false"
  DEMO_MODE: "true"

# Secrets. Prefer creating the Secret yourself and setting existingSecret:
#   kubectl create secret generic agentic-soc-secrets --from-env-file=.env
existingSecret: ""
secrets:
  ANALYST_USERNAME: analyst
  ANALYST_PASSWORD: ""
  SECRET_KEY: ""
  INGEST_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GROQ_API_KEY: ""
  OKTA_API_TOKEN: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
