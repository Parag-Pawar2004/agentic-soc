apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soc.name" . }}-frontend
  labels: {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: frontend
          image: {{ include "soc.image" (dict "root" . "component" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soc.name" . }}-frontend
  labels: {{- include "soc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
  ports: [{ name: http, port: 3000, targetPort: http }]
