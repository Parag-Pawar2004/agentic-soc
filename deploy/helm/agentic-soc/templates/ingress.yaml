{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soc.name" . }}
  labels: {{- include "soc.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "soc.name" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $p := list "/api" "/ws" "/docs" "/openapi.json" }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service: { name: {{ include "soc.name" $ }}-backend, port: { number: 8000 } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "soc.name" . }}-frontend, port: { number: 3000 } }
{{- end }}
