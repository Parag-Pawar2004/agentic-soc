apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soc.name" . }}-config
  labels: {{- include "soc.labels" . | nindent 4 }}
data:
  DATA_DIR: /data
  CORS_ORIGINS: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls) .Values.ingress.host | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soc.secretName" . }}
  labels: {{- include "soc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.secrets.SECRET_KEY }}
  SECRET_KEY: {{ randAlphaNum 48 | quote }}
  {{- end }}
{{- end }}
